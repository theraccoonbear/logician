name: Deploy live demo to GitHub Pages

# Deploys to the gh-pages branch (root), not the actions/deploy-pages "environments" flow —
# switched deliberately (issue #12) so PR previews (deploy-pr-preview.yml) can live alongside
# the live site as gh-pages/pr-<N>/ subdirectories. GitHub Pages only supports one source per
# repo, so this and the PR-preview workflow must agree on the same mechanism.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with deploy-pr-preview.yml's deploy/cleanup jobs, not just this workflow: every job
# that pushes to the gh-pages branch needs to be mutually exclusive with every other one, or
# two concurrent pushes (e.g. a main deploy and a PR preview landing at the same moment) can
# race. Queue rather than cancel — cancel-in-progress would drop a legitimate PR preview or
# live deploy just because something else touched gh-pages at the same time.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Run Unit Tests
        run: npx vitest run
      - name: Build Application
        run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Without this, every live deploy would wipe out every PR preview subdirectory
          # sitting alongside it on the gh-pages branch.
          keep_files: true
